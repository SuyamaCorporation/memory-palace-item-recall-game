<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記憶術 場所法 記憶ゲーム</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-2xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-gray-800 mb-2">記憶術 場所法 記憶ゲーム</h1>
  <p class="text-sm text-gray-500 mb-4">部屋の各場所に配置された単語を記憶してから再配置してください</p>

  <!-- メニュー -->
  <div id="menu-screen">
    <div class="bg-white rounded-xl shadow-md p-5 mb-4">
      <h2 class="text-sm font-semibold text-gray-500 uppercase mb-3">難易度（アイテム数）</h2>
      <div class="grid grid-cols-4 gap-2 mb-4">
        <label class="text-center">
          <input type="radio" name="item-count" value="5" checked class="sr-only peer">
          <div class="peer-checked:bg-blue-500 peer-checked:text-white bg-gray-100 text-gray-600 rounded-lg p-3 text-sm font-bold cursor-pointer hover:bg-gray-200 transition-colors" aria-label="5アイテム">5個</div>
        </label>
        <label class="text-center">
          <input type="radio" name="item-count" value="10" class="sr-only peer">
          <div class="peer-checked:bg-blue-500 peer-checked:text-white bg-gray-100 text-gray-600 rounded-lg p-3 text-sm font-bold cursor-pointer hover:bg-gray-200 transition-colors" aria-label="10アイテム">10個</div>
        </label>
        <label class="text-center">
          <input type="radio" name="item-count" value="15" class="sr-only peer">
          <div class="peer-checked:bg-blue-500 peer-checked:text-white bg-gray-100 text-gray-600 rounded-lg p-3 text-sm font-bold cursor-pointer hover:bg-gray-200 transition-colors" aria-label="15アイテム">15個</div>
        </label>
        <label class="text-center">
          <input type="radio" name="item-count" value="15" class="sr-only peer" id="item-20" disabled>
          <div class="peer-checked:bg-blue-500 peer-checked:text-white bg-gray-100 text-gray-600 rounded-lg p-3 text-sm font-bold cursor-pointer hover:bg-gray-200 transition-colors opacity-50" aria-label="全15アイテム">全15</div>
        </label>
      </div>
      <button onclick="startGame()" aria-label="ゲーム開始"
        class="w-full py-3 bg-blue-600 text-white rounded-lg font-bold text-lg hover:bg-blue-700 transition-colors">
        ゲーム開始
      </button>
    </div>

    <div id="best-score-display" class="bg-white rounded-xl shadow-md p-4 text-center">
      <p class="text-sm text-gray-500">ベストスコア</p>
      <div id="best-scores" class="text-sm text-gray-700 mt-2"></div>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-screen" class="hidden">
    <div id="phase-header" class="bg-white rounded-xl shadow-md p-4 mb-4 text-center">
      <div id="phase-name" class="text-xl font-bold text-gray-800"></div>
      <div id="phase-hint" class="text-sm text-gray-500 mt-1"></div>
      <div id="timer-bar-container" class="mt-3 hidden">
        <div class="w-full bg-gray-100 rounded-full h-2">
          <div id="timer-bar" class="h-2 rounded-full bg-blue-500 transition-all" style="width:100%"></div>
        </div>
      </div>
    </div>

    <!-- 部屋ビュー -->
    <div id="rooms-container" class="space-y-4 mb-4"></div>

    <!-- アクション -->
    <div class="flex gap-3 justify-center mb-4">
      <button id="btn-done" onclick="endMemoryPhase()" aria-label="覚えた！"
        class="hidden px-8 py-3 bg-green-600 text-white rounded-lg font-bold hover:bg-green-700">
        覚えた！
      </button>
      <button id="btn-submit" onclick="submitAnswers()" aria-label="答え合わせ"
        class="hidden px-8 py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700">
        答え合わせ
      </button>
      <button onclick="resetToMenu()" aria-label="メニューに戻る"
        class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300">
        メニュー
      </button>
    </div>

    <!-- 結果 -->
    <div id="result-area" class="hidden bg-white rounded-xl shadow-md p-5 text-center">
      <div id="result-score" class="text-4xl font-bold text-blue-600 mb-2"></div>
      <div class="text-gray-500 mb-2" id="result-detail"></div>
      <div id="result-hs" class="text-sm text-gray-400"></div>
    </div>
  </div>
</div>

<script>
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

const ROOMS = [
  { id: 'genkan', name: '玄関', emoji: '🚪', color: 'bg-amber-50 border-amber-200',
    spots: ['ドア前', '下駄箱', '鏡の前', '傘立て', '郵便受け'] },
  { id: 'living', name: 'リビング', emoji: '🛋️', color: 'bg-blue-50 border-blue-200',
    spots: ['ソファ', 'テレビ前', 'テーブル上', '窓際', '本棚'] },
  { id: 'kitchen', name: 'キッチン', emoji: '🍳', color: 'bg-green-50 border-green-200',
    spots: ['シンク', '冷蔵庫', 'コンロ前', '電子レンジ上', '食器棚'] },
];

const WORDS = [
  'りんご','バナナ','本','鉛筆','電話','鍵','帽子','財布','時計','眼鏡',
  'カメラ','バッグ','傘','靴','スマホ','ノート','消しゴム','ハサミ','テープ','コップ'
];

const STORAGE_KEY = 'memory_palace_hs_v2';
let itemCount = 5;
let assignments = []; // [{roomId, spot, word}]
let playerAnswers = {}; // `${roomId}_${spotIdx}` -> word
let phase = 'menu';
let timerInterval = null;

function loadBestScores() {
  const el = document.getElementById('best-scores');
  const lines = [5, 10, 15].map(n => {
    const hs = getHS(n);
    return hs > 0 ? n + '個: ' + hs + '/' + n + '正解' : n + '個: -';
  });
  el.textContent = lines.join('　　');
}

function getHS(n) {
  try { return parseInt(localStorage.getItem(STORAGE_KEY + n)) || 0; } catch(e) { return 0; }
}
function setHS(n, val) {
  try {
    if (val > getHS(n)) localStorage.setItem(STORAGE_KEY + n, val);
  } catch(e) {}
}

function startGame() {
  itemCount = parseInt(document.querySelector('input[name="item-count"]:checked').value);
  itemCount = Math.min(itemCount, 15);

  // アサイン生成
  const shuffledWords = [...WORDS].sort(() => Math.random() - 0.5).slice(0, itemCount);
  const allSpots = [];
  ROOMS.forEach(room => room.spots.forEach((spot, i) => allSpots.push({ roomId: room.id, spotIdx: i, spot })));
  const selectedSpots = allSpots.sort(() => Math.random() - 0.5).slice(0, itemCount);

  assignments = selectedSpots.map((s, i) => ({ ...s, word: shuffledWords[i] }));
  playerAnswers = {};

  document.getElementById('menu-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  document.getElementById('result-area').classList.add('hidden');

  startMemoryPhase();
}

function startMemoryPhase() {
  phase = 'memory';
  document.getElementById('phase-name').textContent = '記憶フェーズ';
  document.getElementById('phase-hint').textContent = '各場所の単語を5秒間覚えてください';
  document.getElementById('btn-done').classList.remove('hidden');
  document.getElementById('btn-submit').classList.add('hidden');
  document.getElementById('timer-bar-container').classList.remove('hidden');

  renderRooms(true);

  let elapsed = 0;
  const duration = 5000;
  const bar = document.getElementById('timer-bar');
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    elapsed += 100;
    bar.style.width = Math.max(0, (1 - elapsed / duration) * 100) + '%';
    if (elapsed >= duration) {
      clearInterval(timerInterval);
      endMemoryPhase();
    }
  }, 100);
}

function endMemoryPhase() {
  clearInterval(timerInterval);
  phase = 'recall';
  document.getElementById('phase-name').textContent = '再現フェーズ';
  document.getElementById('phase-hint').textContent = '各場所の単語をドロップダウンで選んでください';
  document.getElementById('btn-done').classList.add('hidden');
  document.getElementById('btn-submit').classList.remove('hidden');
  document.getElementById('timer-bar-container').classList.add('hidden');

  renderRooms(false);
}

function renderRooms(showWords) {
  const container = document.getElementById('rooms-container');
  container.innerHTML = '';

  ROOMS.forEach(room => {
    const roomAssignments = assignments.filter(a => a.roomId === room.id);
    if (roomAssignments.length === 0) return;

    const card = document.createElement('div');
    card.className = 'bg-white rounded-xl shadow-md p-4 border ' + room.color;

    const header = document.createElement('div');
    header.className = 'flex items-center gap-2 mb-3';
    header.innerHTML = '<span class="text-2xl">' + room.emoji + '</span><span class="font-bold text-gray-800">' + escapeHtml(room.name) + '</span>';
    card.appendChild(header);

    const spotGrid = document.createElement('div');
    spotGrid.className = 'space-y-2';

    room.spots.forEach((spot, spotIdx) => {
      const assignment = roomAssignments.find(a => a.spotIdx === spotIdx);
      if (!assignment) return;

      const row = document.createElement('div');
      row.className = 'flex items-center gap-3';

      const spotLabel = document.createElement('div');
      spotLabel.className = 'text-sm text-gray-500 w-24 flex-shrink-0';
      spotLabel.textContent = spot;

      row.appendChild(spotLabel);

      if (showWords) {
        const wordEl = document.createElement('div');
        wordEl.className = 'flex-1 bg-white rounded-lg px-3 py-1.5 text-sm font-bold text-gray-800 border border-gray-200 text-center';
        wordEl.textContent = assignment.word;
        row.appendChild(wordEl);
      } else {
        const key = room.id + '_' + spotIdx;
        const sel = document.createElement('select');
        sel.className = 'flex-1 border border-gray-300 rounded-lg p-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none';
        sel.setAttribute('aria-label', room.name + 'の' + spot + 'の単語');
        sel.dataset.key = key;
        sel.onchange = (e) => { playerAnswers[key] = e.target.value; };

        const opt0 = document.createElement('option');
        opt0.value = '';
        opt0.textContent = '-- 選択 --';
        sel.appendChild(opt0);

        const wordOptions = [...WORDS].sort();
        wordOptions.forEach(w => {
          const opt = document.createElement('option');
          opt.value = w;
          opt.textContent = w;
          if (playerAnswers[key] === w) opt.selected = true;
          sel.appendChild(opt);
        });
        row.appendChild(sel);
      }
      spotGrid.appendChild(row);
    });
    card.appendChild(spotGrid);
    container.appendChild(card);
  });
}

function submitAnswers() {
  let correct = 0;
  assignments.forEach(a => {
    const key = a.roomId + '_' + a.spotIdx;
    if (playerAnswers[key] === a.word) correct++;
  });

  setHS(itemCount, correct);

  document.getElementById('result-area').classList.remove('hidden');
  document.getElementById('result-score').textContent = correct + '/' + itemCount + ' 正解';
  const pct = Math.round(correct / itemCount * 100);
  document.getElementById('result-detail').textContent = '正確度: ' + pct + '%';
  document.getElementById('result-hs').textContent = 'ベストスコア: ' + getHS(itemCount) + '/' + itemCount;
  document.getElementById('btn-submit').classList.add('hidden');

  // 正解をハイライト
  renderResultRooms();
}

function renderResultRooms() {
  const container = document.getElementById('rooms-container');
  container.innerHTML = '';
  ROOMS.forEach(room => {
    const roomAssignments = assignments.filter(a => a.roomId === room.id);
    if (roomAssignments.length === 0) return;
    const card = document.createElement('div');
    card.className = 'bg-white rounded-xl shadow-md p-4 border ' + room.color;
    const header = document.createElement('div');
    header.className = 'flex items-center gap-2 mb-3';
    header.innerHTML = '<span class="text-2xl">' + room.emoji + '</span><span class="font-bold text-gray-800">' + escapeHtml(room.name) + '</span>';
    card.appendChild(header);
    const spotGrid = document.createElement('div');
    spotGrid.className = 'space-y-2';
    room.spots.forEach((spot, spotIdx) => {
      const assignment = roomAssignments.find(a => a.spotIdx === spotIdx);
      if (!assignment) return;
      const key = room.id + '_' + spotIdx;
      const isCorrect = playerAnswers[key] === assignment.word;
      const row = document.createElement('div');
      row.className = 'flex items-center gap-3';
      const spotLabel = document.createElement('div');
      spotLabel.className = 'text-sm text-gray-500 w-24 flex-shrink-0';
      spotLabel.textContent = spot;
      const resultEl = document.createElement('div');
      resultEl.className = 'flex-1 rounded-lg px-3 py-1.5 text-sm font-bold text-center border ' +
        (isCorrect ? 'bg-green-100 text-green-700 border-green-300' : 'bg-red-100 text-red-700 border-red-300');
      const playerWord = playerAnswers[key] || '未回答';
      resultEl.textContent = isCorrect ? '✓ ' + assignment.word :
        '✗ ' + playerWord + ' → 正解: ' + assignment.word;
      row.appendChild(spotLabel);
      row.appendChild(resultEl);
      spotGrid.appendChild(row);
    });
    card.appendChild(spotGrid);
    container.appendChild(card);
  });
}

function resetToMenu() {
  clearInterval(timerInterval);
  document.getElementById('menu-screen').classList.remove('hidden');
  document.getElementById('game-screen').classList.add('hidden');
  loadBestScores();
}

loadBestScores();
</script>
</body>
</html>
